<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>String-Pattern Processor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0 auto;
            padding: 24px;
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        input[type="text"] {
            padding: 8px;
            font-size: 16px;
            width: 250px;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .output-box {
            margin-top: 20px;
            padding: 16px;
            background: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        pre {
            background: #fff;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 15px;
            line-height: 1.4;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <h2>Chain Logic Processor</h2>

    <div class="form-group">

        <label for="strInput">
            Enter String (3-10 alphabets):
        </label>

        <br><br>

        <input
            type="text"
            id="strInput"
            placeholder="e.g. hello"
        >

        <button onclick="processString()">
            Submit
        </button>

    </div>


    <div
        id="output"
        class="output-box"
        style="display: none;"
    ></div>


    <script>

        function processString() {
            const outputDiv = document.getElementById("output");

            outputDiv.style.display = "block";
            const rawInput =
                document.getElementById("strInput").value.trim();


            const alphabetOnly = /^[a-zA-Z]+$/;

            if (
                !alphabetOnly.test(rawInput) ||
                rawInput.length < 3 ||
                rawInput.length > 10
            ) {

                outputDiv.innerHTML =
                    '<p class="error">Validation Error: Input must contain only alphabet letters and be 3 to 10 characters long.</p>';
                return;
            }

            const upperStr = rawInput.toUpperCase();

            const strLen = upperStr.length;
            const vowels = ['A', 'E', 'I', 'O', 'U'];

            let vowelCount = 0;
            let consonantCount = 0;


            for (let char of upperStr) {

                if (vowels.includes(char)) {

                    vowelCount++;

                } else {

                    consonantCount++;

                }
            }

            let pattern1 = "";


            for (let i = 1; i <= strLen; i++) {

                let row = "";


                for (let j = 0; j < i; j++) {

                    row += upperStr[strLen - 1 - j] + " ";

                }


                pattern1 += row.trimEnd() + "\n";
            }

            const squareSize = vowelCount + 3;
            let pattern2 = "";
            for (let row = 0; row < squareSize; row++) {

                let line = "";


                for (let col = 0; col < squareSize; col++) {
                    if (
                        row === 0 ||
                        row === squareSize - 1 ||
                        col === 0 ||
                        col === squareSize - 1
                    ) {

                        line += "* ";

                    } else {
                        line += "  ";
                    }
                }


                pattern2 += line.trimEnd() + "\n";
            }

            const dominanceMessage =
                vowelCount > consonantCount
                    ? "VOWEL DOMINANT"
                    : "CONSONANT DOMINANT";

            outputDiv.innerHTML = `

                <p>
                    <strong>Step 2 (Uppercase):</strong>
                    ${upperStr}
                </p>


                <p>
                    <strong>Step 3:</strong>
                    Vowels = ${vowelCount},
                    Consonants = ${consonantCount}
                </p>


                <p>
                    <strong>
                        Step 4 - Pattern 1
                        (Reverse Ladder, Height = ${strLen}):
                    </strong>
                </p>


                <pre>${pattern1}</pre>


                <p>
                    <strong>
                        Step 5 - Pattern 2
                        (Hollow Square, Size = ${squareSize}):
                    </strong>
                </p>


                <pre>${pattern2}</pre>


                <p>
                    <strong>
                        Step 6 - Dominance Result:
                    </strong>

                    <strong>
                        ${dominanceMessage}
                    </strong>
                </p>

            `;
        }

    </script>
</body>
</html>
