<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h2>Expense Tracker</h2>

    <div class="summary-container">
      <div class="summary-box">
        <span class="label">Total Balance</span>
        <span class="val" id="totalBalance">₹0.00</span>
      </div>
      <div class="summary-box">
        <span class="label">Income</span>
        <span class="val income-text" id="totalIncome">+₹0.00</span>
      </div>
      <div class="summary-box">
        <span class="label">Expense</span>
        <span class="val expense-text" id="totalExpense">-₹0.00</span>
      </div>
    </div>

    <form id="trackerForm">
      <input type="hidden" id="editId">

      <div class="field-group">
        <label for="title">Description</label>
        <input type="text" id="title" placeholder="e.g., Salary, Rent, Coffee" required>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
        </div>
        <div class="field-group">
          <label for="type">Type</label>
          <select id="type" required>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submitBtn">Add Transaction</button>
      <button type="button" id="cancelBtn" class="secondary-btn" style="display: none;">Cancel Edit</button>
    </form>

    <div class="filter-row">
      <label for="filter">Filter:</label>
      <select id="filter">
        <option value="all">All</option>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
    </div>

    <ul id="transactionList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
